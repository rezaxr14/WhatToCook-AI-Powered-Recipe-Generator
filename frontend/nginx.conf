server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/wasm;

    # Django REST API (incl. SSE streaming endpoints)
    location /api/ {
        proxy_pass http://web:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # Uploaded media (recipe images, etc.)
    location /media/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
    }

    # Django admin + its static assets through the same origin
    location /admin/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /static/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
    }

    # Legacy server-rendered pages
    location /legacy/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
    }
    location = /legacy {
        return 301 /legacy/;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
